name: PR Build and Tests

on:
  workflow_call:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build and test paths
        run: |
          cross_fs_dir="$(mktemp -d /dev/shm/jaromail-cross-fs.XXXXXXXX)"
          python3 - "$cross_fs_dir" <<'PY'
          from pathlib import Path
          import sys
          import tempfile
          cross = Path(sys.argv[1])
          for source in (Path.cwd(), Path(tempfile.gettempdir())):
              if cross.stat().st_dev == source.stat().st_dev:
                  raise SystemExit(f'Cross-filesystem fixture shares a filesystem with {source}')
          PY
          printf '%s\n' \
            "CCACHE_DIR=$RUNNER_TEMP/jaromail-ccache" \
            "SIEVE_TOOLS_OUTPUT=$RUNNER_TEMP/jaromail-sieve-tools" \
            "JARO_TEST_LOG_DIR=$RUNNER_TEMP/jaromail-test-logs" \
            "JARO_FILTER_CROSS_FS_DIR=$cross_fs_dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            zsh make cmake ninja-build gcc python3 perl pkg-config ccache libssl-dev zlib1g-dev libpcre2-dev binutils libncurses-dev libreadline-dev \
            fetchmail msmtp neomutt notmuch pinentry-curses \
            abook wipe mblaze gnupg pandoc ca-certificates netcat-traditional

      - name: Identify Sieve build prerequisites
        id: sieve-cache
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          import subprocess
          identity = Path('/etc/os-release').read_bytes()
          for command in (['cc', '--version'], ['make', '--version'],
                          ['pkg-config', '--modversion', 'openssl', 'zlib', 'libpcre2-32']):
              identity += subprocess.check_output(command)
          print('identity=' + hashlib.sha256(identity).hexdigest())
          PY

      - name: Restore private Sieve development cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/jaromail-sieve-deps
            ${{ runner.temp }}/jaromail-sieve-sources
            ${{ runner.temp }}/jaromail-ccache
          key: ${{ runner.os }}-sieve-2.4.5-${{ hashFiles('build/sieve-deps.py', 'vendor/sources.json') }}-${{ steps.sieve-cache.outputs.identity }}
          restore-keys: ${{ runner.os }}-sieve-2.4.5-

      # Cache hits still verify release signatures, configuration and installed bytes.
      - name: Provision matched private Sieve development dependencies
        run: |
          sieve_prefix="$(python3 build/sieve-deps.py \
            --source-cache "$RUNNER_TEMP/jaromail-sieve-sources" \
            --cache-dir "$RUNNER_TEMP/jaromail-sieve-deps" --regex-prefix /usr --mail-utf8 --download)"
          printf 'SIEVE_DEPS_PREFIX=%s\n' "$sieve_prefix" >> "$GITHUB_ENV"

      - name: Compile extracted Sieve validation frontends
        run: python3 build/sieve-tools.py

      - name: Build application
        run: |
          cmake -S . -B out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/ci --parallel 2

      - name: Run all regression tests (no skips)
        run: |
          mkdir -p "$JARO_TEST_LOG_DIR"
          cmake --build out/ci --target check-strict

      - name: Upload regression test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jaromail-test-logs
          if-no-files-found: ignore
          retention-days: 7

  version-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.nextStrict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select release baseline
        id: baseline
        run: python3 build/release.py prepare --output "$GITHUB_OUTPUT"
      - name: Preview semantic version without publishing
        id: semver
        uses: ietf-tools/semver-action@46feaa27e7375da0e3d602721e9fb9573598b880
        with:
          token: ${{ github.token }}
          branch: ${{ github.event.pull_request.head.sha }}
          fromTag: ${{ steps.baseline.outputs.tag }}
          additionalCommits: ${{ steps.baseline.outputs.additional }}
          majorList: breaking
          noNewCommitBehavior: current
          noVersionBumpBehavior: patch
      - name: Validate the proposed release version
        env:
          CURRENT_VERSION: ${{ steps.baseline.outputs.tag }}
          NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: python3 build/release.py validate-version --current "$CURRENT_VERSION" --next "$NEXT_VERSION"

  static:
    if: github.event_name == 'pull_request'
    needs: version-preview
    uses: ./.github/workflows/linux-static.yml
    with:
      version: ${{ needs.version-preview.outputs.version }}
