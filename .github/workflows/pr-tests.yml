name: PR Tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            zsh make gcc python3 \
            fetchmail msmtp neomutt notmuch pinentry-curses \
            abook wipe mblaze gnupg pandoc ca-certificates netcat-traditional

      - name: Build and run all regression tests
        run: make test-strict
