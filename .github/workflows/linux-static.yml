name: Static Linux artifacts

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Linux static (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            musl: x86_64
            processor: x86_64
          - arch: arm64
            musl: arm_64
            processor: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build make gcc ccache binutils zsh qemu-user
      - name: Set up verified Dyne musl cross compiler
        id: musl
        uses: dyne/musl-action@fe1d1871b096824ddb7aa158f68dd63dabdc9586
        with:
          target_arch: ${{ matrix.musl }}
          version: v2.6.0
      - name: Set abook dependency paths
        run: |
          printf 'CCACHE_DIR=%s\n' "$RUNNER_TEMP/jaromail-abook-ccache" >> "$GITHUB_ENV"
      - name: Restore static abook dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/jaromail-abook-deps
            ${{ runner.temp }}/jaromail-abook-ccache
          key: ${{ runner.os }}-abook-musl-v2.6.0-${{ matrix.arch }}-${{ hashFiles('build/abook-deps.py', 'build/abook-deps.json') }}
      - name: Use bundled static ncurses and GNU readline
        env:
          MUSL_CC: ${{ steps.musl.outputs.CC }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          prefix=$(python3 build/abook-deps.py --cc "$MUSL_CC" --arch "$TARGET_ARCH" \
            --cache-dir "$RUNNER_TEMP/jaromail-abook-deps" \
            --source-cache "$RUNNER_TEMP/jaromail-abook-sources" --require-bundled)
          printf 'JARO_ABOOK_DEPS_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
      - name: Resolve assigned version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            assigned=$(python3 build/version.py --version "$RELEASE_VERSION")
          else
            assigned=$(python3 build/version.py)
          fi
          printf 'version=%s\n' "$assigned" >> "$GITHUB_OUTPUT"
      - name: Configure static CMake build
        env:
          MUSL_CC: ${{ steps.musl.outputs.CC }}
          ASSIGNED_VERSION: ${{ steps.version.outputs.version }}
          TARGET_PROCESSOR: ${{ matrix.processor }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake -S . -B out/static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$MUSL_CC" \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$TARGET_PROCESSOR" \
            -DJARO_VERSION="$ASSIGNED_VERSION" -DJARO_PACKAGE_ARCH="$TARGET_ARCH" \
            -DJARO_ABOOK_DEPS_PREFIX="$JARO_ABOOK_DEPS_PREFIX" \
            -DJARO_STATIC=ON -DBUILD_TESTING=OFF -DJARO_BUILD_TEST_DRIVERS=OFF
          cmake --build out/static --parallel 2
      - name: Verify every binary is static and has the right architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 build/check-static.py --bin-dir out/static/bin --arch "$TARGET_ARCH"
      - name: Run native or emulated helper smoke tests
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          emulator=()
          if [[ "$TARGET_ARCH" == arm64 ]]; then emulator=(qemu-aarch64); fi
          "${emulator[@]}" out/static/bin/jaro-filter-compile --version
          "${emulator[@]}" out/static/bin/jaro-filter-compile --check-address person@example.org
          "${emulator[@]}" out/static/bin/abook --help | grep -Fx 'abook v0.6.2'
          printf 'alias fixture Static Test <static.person.with.a.long.address@example.org>\n' > out/abook-aliases
          "${emulator[@]}" out/static/bin/abook --config /dev/null --convert \
            --informat mutt --infile out/abook-aliases --outformat abook --outfile out/abook-fixture
          "${emulator[@]}" out/static/bin/abook --config /dev/null --datafile out/abook-fixture \
            --mutt-query '' | grep -F 'static.person.with.a.long.address@example.org'
          abook_emulator=()
          if [[ "$TARGET_ARCH" == arm64 ]]; then abook_emulator=(--emulator qemu-aarch64); fi
          python3 extras/test/abook-tui-smoke.py --binary out/static/bin/abook \
            --no-terminfo "${abook_emulator[@]}"
          printf 'From: Static Test <person@example.org>\n\n' | \
            "${emulator[@]}" out/static/bin/fetchaddr -a -e | grep -Fx person@example.org
      - name: Package and test the relocated CLI
        env:
          ASSIGNED_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake --build out/static --target package
          archive="jaromail-${ASSIGNED_VERSION}-linux-${TARGET_ARCH}.tar.gz"
          mkdir -p dist out/unpacked
          cp "out/static/$archive" dist/
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          tar -xzf "dist/$archive" -C out/unpacked
          package_root="out/unpacked/${archive%.tar.gz}"
          test "$("$package_root/bin/jaro" --version)" = "Jaro Mail v$ASSIGNED_VERSION"
          python3 build/check-static.py --bin-dir "$package_root/share/jaromail/bin" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: static-base-${{ matrix.arch }}
          overwrite: true
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package:
    name: Linux release with Sieve (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: static-base-${{ matrix.arch }}
          path: base
      - name: Install native build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build make gcc ccache pkg-config libssl-dev zlib1g-dev libpcre2-dev libncurses-dev libreadline-dev zsh
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/sieve-deps
            ${{ runner.temp }}/sieve-sources
          key: sieve-release-24.04-${{ runner.arch }}-${{ hashFiles('build/sieve-deps.py', 'vendor/sources.json') }}
      - name: Build private runtime for the package architecture
        run: |
          prefix=$(python3 build/sieve-deps.py --cache-dir "$RUNNER_TEMP/sieve-deps" \
            --source-cache "$RUNNER_TEMP/sieve-sources" --regex-prefix /usr --mail-utf8 --download)
          cmake -S . -B out/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJARO_SIEVE_DEPS_PREFIX="$prefix" -DBUILD_TESTING=OFF -DJARO_BUILD_TEST_DRIVERS=OFF
          cmake --build out/runtime --target sieve-runtime
      - name: Assemble and exercise the relocated release archive
        run: |
          (cd base && sha256sum -c *.sha256)
          archives=(base/*.tar.gz)
          archive=${archives[0]##*/}
          bundle=${archive%.tar.gz}
          mkdir stage dist relocated
          tar -xzf "base/$archive" -C stage
          cmake --install out/runtime --component sieve --prefix "$PWD/stage/$bundle"
          tar -czf "dist/$archive" -C stage "$bundle"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          tar -xzf "dist/$archive" -C relocated
          bash extras/test/release-filter-smoke.sh "$PWD/relocated/$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-static-${{ matrix.arch }}
          path: dist/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7
