name: Semantic Linux release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaromail-semantic-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.nextStrict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select baseline and bootstrap the v6 major release
        id: baseline
        run: python3 build/release.py prepare --output "$GITHUB_OUTPUT"
      - name: Assign version from Conventional Commits
        id: semver
        uses: ietf-tools/semver-action@46feaa27e7375da0e3d602721e9fb9573598b880
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fromTag: ${{ steps.baseline.outputs.tag }}
          additionalCommits: ${{ steps.baseline.outputs.additional }}
          majorList: breaking
          noNewCommitBehavior: current
          noVersionBumpBehavior: patch
      - name: Validate the v6 baseline and version progression
        env:
          CURRENT_VERSION: ${{ steps.baseline.outputs.tag }}
          NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: python3 build/release.py validate-version --current "$CURRENT_VERSION" --next "$NEXT_VERSION"

  verify:
    needs: version
    uses: ./.github/workflows/pr-tests.yml

  build:
    needs: [version, verify]
    uses: ./.github/workflows/linux-static.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-static-*
          path: dist
          merge-multiple: true
      - name: Publish both verified architectures as one release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 build/release.py publish --version "$ASSIGNED_VERSION" \
            --artifacts dist --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
