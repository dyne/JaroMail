# Local delivery runs in a private per-invocation home. The launcher binds
# incoming/mail and folders there before handing control to Pigeonhole.
dovecot_config_version = 2.4.5
!include dovecot.conf
mailbox_list_layout = fs
mailbox_list_utf8 = yes
mailbox_list_index = no
mail_fsync = always
maildir_copy_with_hardlinks = no
namespace inbox {
  mail_path = ~/folders
  mail_inbox_path = ~/folders/INBOX
  mail_control_path = ~/control/destination
  mail_index_path = ~/index/destination
}
namespace source {
  prefix = .jaro-source/
  separator = /
  hidden = yes
  list = no
  subscriptions = no
  mail_path = ~/incoming
  mail_control_path = ~/control/source
  mail_index_path = ~/index/source
}
