dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5
base_dir = /dev/null
state_dir = /dev/null
log_path = /dev/stderr
info_log_path = /dev/stderr
# Match the compiler text-product limit for large policy snapshots.
sieve_max_script_size = 128M
mail_driver = maildir
mail_path = /dev/null
namespace inbox {
  inbox = yes
  separator = /
}
